name: iOS · TestFlight

# Compila o app iOS num runner macOS da nuvem e envia para o TestFlight /
# App Store. Nenhum Mac local e necessario.
#
# Disparo manual: aba Actions > "iOS · TestFlight" > Run workflow.
# Disparo por tag:  git tag ios-v1.0.0 && git push origin ios-v1.0.0

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "O que fazer"
        type: choice
        default: beta
        options:
          - bootstrap   # 1x: cria App ID, app na App Store Connect e assinaturas
          - beta        # compila e envia para o TestFlight
          - release     # envia a ultima build para revisao da App Store
      marketing_version:
        # Sem valor padrao de proposito. A Apple fecha a versao assim que ela e
        # publicada: reenviar com o mesmo numero falha com "Invalid Pre-Release
        # Train ... is closed for new build submissions" depois de ja ter
        # compilado e assinado. Preencher a cada execucao evita esse desperdicio.
        description: "Versao visivel na loja — precisa ser MAIOR que a ja publicada (ex.: 1.0.1)"
        type: string
        required: true
  push:
    tags:
      - "ios-v*"

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90

    env:
      APP_IDENTIFIER: com.leveljiujitsu.app
      APP_NAME: LEVEL JIUJITSU
      MARKETING_VERSION: ${{ inputs.marketing_version }}

      # --- Apple: App Store Connect API Key ---
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      # Team ID nao e segredo: ele vai embutido em todo app publicado.
      ASC_TEAM_ID: 8CAAFT4F27

      # --- fastlane match (repositorio PRIVADO e separado com os certificados) ---
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}

      # A config publica do Firebase vem do `.env` versionado no repositorio,
      # igual ao `npm run deploy:hosting`. NAO declare as VITE_* aqui: um secret
      # ausente viraria string vazia e sobrescreveria o valor do `.env`.

      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mostrar versao do Xcode
        run: xcodebuild -version

      # O CLI do Capacitor 8 exige Node >= 22.
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build do frontend (dist/)
        if: ${{ inputs.lane != 'bootstrap' }}
        run: npm run build

      - name: Sincronizar o projeto iOS (Capacitor)
        if: ${{ inputs.lane != 'bootstrap' }}
        run: npx cap sync ios

      # O AppIcon do Xcode nao e atualizado pelo `cap sync`. Gera o icone que
      # sera compilado a partir da fonte versionada em public/, mantendo a
      # proporcao da arte e completando com fundo branco antes de reduzir para
      # o tamanho de 1024x1024 exigido pela App Store.
      - name: Gerar icone iOS a partir de public/icon-source.png
        if: ${{ inputs.lane != 'bootstrap' }}
        shell: bash
        run: |
          set -euo pipefail

          source_icon="public/icon-source.png"
          app_icon="ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"

          test -f "$source_icon"

          width="$(sips -g pixelWidth "$source_icon" | awk '/pixelWidth/ {print $2}')"
          height="$(sips -g pixelHeight "$source_icon" | awk '/pixelHeight/ {print $2}')"
          if (( width > height )); then
            side="$width"
          else
            side="$height"
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT

          sips --padToHeightWidth "$side" "$side" --padColor FFFFFF \
            "$source_icon" --out "$temp_dir/icon-square.png"
          sips --resampleHeightWidth 1024 1024 "$temp_dir/icon-square.png" \
            --out "$app_icon"

          test "$(sips -g pixelWidth "$app_icon" | awk '/pixelWidth/ {print $2}')" = "1024"
          test "$(sips -g pixelHeight "$app_icon" | awk '/pixelHeight/ {print $2}')" = "1024"
          sips -g hasAlpha "$app_icon" | grep -q 'hasAlpha: no'
          echo "AppIcon gerado de $source_icon (origem: ${width}x${height}; saida: 1024x1024, sem alpha)."

      - name: Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Rodar fastlane
        working-directory: ios
        run: bundle exec fastlane ${{ inputs.lane || 'beta' }}

      - name: Guardar o .ipa como artefato
        if: ${{ always() && inputs.lane != 'bootstrap' }}
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ios/build/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Guardar os logs em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fastlane-logs
          path: |
            ios/fastlane/report.xml
            /Users/runner/Library/Logs/gym
          if-no-files-found: ignore
          retention-days: 7
