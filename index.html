  <script>
    // Links de redefinicao enviados no formato do Firebase (?mode=resetPassword&oobCode=...)
    // vao para a pagina independente, antes do React tocar em localStorage — que o
    // navegador embutido do Gmail/Instagram/WhatsApp bloqueia.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var oobCode = params.get('oobCode');
      if (params.get('mode') === 'resetPassword' && oobCode) {
        window.location.replace('/redefinir-senha/?oobCode=' + encodeURIComponent(oobCode));
      }
    })();
  </script>
