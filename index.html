
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>APPLevel</title>
  <meta name="theme-color" content="#F0B429">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="APPLevel">
  <meta name="mobile-web-app-capable" content="yes">
  <script>
    // Links de redefinicao enviados no formato do Firebase (?mode=resetPassword&oobCode=...)
    // vao para a pagina independente, antes do React tocar em localStorage — que o
    // navegador embutido do Gmail/Instagram/WhatsApp bloqueia.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var oobCode = params.get('oobCode');
      if (params.get('mode') === 'resetPassword' && oobCode) {
        window.location.replace('/redefinir-senha/?oobCode=' + encodeURIComponent(oobCode));
      }
    })();
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/logo3.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/logo3.png">
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
  </style>
<!-- Estilos e fontes vao dentro do pacote do app: nada depende de internet para abrir. -->
<link rel="stylesheet" href="/index.css">
<link rel="stylesheet" href="/tailwind.css">
</head>
<body class="bg-white dark:bg-dark text-gray-900 dark:text-gray-100 transition-colors duration-300">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
